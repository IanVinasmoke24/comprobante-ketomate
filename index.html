<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COMPROBANTE KE-KALABAZA</title>
  <meta name="description" content="Datos bancarios para tu pago y envío de comprobante por WhatsApp - KETOMATE.">
  <link rel="icon" href="logo.png.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Bangers&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --orange: #ff9a1f;
      --orange2: #ff5e00;
      --purple: #8e3bd8;
      --dark: #12061d
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 20px;
      overflow-x: hidden;
      position: relative;
      background: linear-gradient(135deg, #12061d, #2a0f45, #4a1d00, #12061d);
      background-size: 300% 300%;
      animation: bg 14s ease infinite
    }

    @keyframes bg {
      50% {
        background-position: 100% 50%
      }
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .45;
      z-index: 0
    }

    body::before {
      background: var(--purple);
      top: -120px;
      left: -120px
    }

    body::after {
      background: var(--orange2);
      bottom: -140px;
      right: -120px
    }

    .float {
      position: fixed;
      font-size: 1.8rem;
      opacity: .5;
      z-index: 0;
      animation: drift 7s ease-in-out infinite;
      pointer-events: none
    }

    @keyframes drift {
      50% {
        transform: translateY(-22px) rotate(12deg)
      }
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      text-align: center
    }

    .logo-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 6px
    }

    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--orange), var(--purple), var(--orange2), var(--orange));
      filter: blur(14px);
      opacity: .85;
      animation: spin 6s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .logo {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .6);
      animation: float 4s ease-in-out infinite
    }

    @keyframes float {
      50% {
        transform: translateY(-8px) scale(1.03)
      }
    }

    h1 {
      font-family: 'Bangers', cursive;
      letter-spacing: 3px;
      font-size: 2.7rem;
      line-height: 1.05;
      margin: 18px 0 8px;
      background: linear-gradient(90deg, #ffd36b, var(--orange), #ff7a1a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .45))
    }

    .sub {
      opacity: .8;
      margin-bottom: 26px;
      font-size: .98rem
    }

    .steps {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: .78rem;
      font-weight: 600
    }

    .steps span {
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .16);
      padding: 6px 12px;
      border-radius: 30px
    }

    .steps b {
      color: var(--orange)
    }

    .card {
      background: linear-gradient(160deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .04));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 26px;
      padding: 6px 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .25);
      position: relative;
      overflow: hidden
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--orange), var(--purple), var(--orange2))
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 0;
      text-align: left
    }

    .row+.row {
      border-top: 1px dashed rgba(255, 255, 255, .18)
    }

    .ico {
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(255, 154, 31, .15)
    }

    .info {
      flex: 1;
      min-width: 0
    }

    .label {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--orange);
      font-weight: 600
    }

    .value {
      font-size: 1.1rem;
      font-weight: 800;
      margin-top: 2px;
      word-break: break-word
    }

    .copy {
      flex-shrink: 0;
      border: 0;
      cursor: pointer;
      color: #fff;
      font: 600 .85rem 'Outfit';
      padding: 10px 15px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .14);
      transition: .2s
    }

    .copy:hover {
      background: var(--purple);
      transform: scale(1.07)
    }

    .copy.ok {
      background: #20b26b
    }

    .all {
      margin-top: 16px;
      background: rgba(255, 255, 255, .06);
      border: 1px dashed rgba(255, 255, 255, .4);
      color: #fff;
      padding: 11px 18px;
      border-radius: 14px;
      cursor: pointer;
      font: 600 .92rem 'Outfit';
      transition: .2s
    }

    .all:hover {
      border-color: var(--orange);
      color: var(--orange);
      background: rgba(255, 154, 31, .1)
    }

    .wa {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      padding: 18px;
      border-radius: 20px;
      text-decoration: none;
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      background: linear-gradient(135deg, var(--orange), var(--orange2));
      box-shadow: 0 12px 34px rgba(255, 94, 0, .5);
      transition: .25s;
      animation: pulse 2.4s infinite
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 12px 44px rgba(255, 140, 0, .85)
      }
    }

    .wa::after {
      content: "";
      position: absolute;
      top: 0;
      left: -80%;
      width: 50%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .4), transparent);
      transform: skewX(-20deg);
      animation: shine 3.2s infinite
    }

    @keyframes shine {
      to {
        left: 130%
      }
    }

    .wa:hover {
      transform: translateY(-4px) scale(1.02)
    }

    .wa svg {
      width: 26px;
      height: 26px;
      fill: #fff;
      flex-shrink: 0
    }

    .wa small {
      display: block;
      font-weight: 400;
      opacity: .9;
      font-size: .8rem
    }

    .wa div {
      text-align: left
    }

    footer {
      margin-top: 22px;
      font-size: .75rem;
      opacity: .55
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent
    }

    .copy,
    .all,
    .wa {
      touch-action: manipulation
    }

    @media (max-width:480px) {
      body {
        padding: 20px 14px;
        align-items: flex-start
      }

      .logo-wrap {
        width: 150px;
        height: 150px
      }

      h1 {
        font-size: 2.1rem;
        letter-spacing: 2px;
        margin-top: 14px
      }

      .sub {
        font-size: .9rem;
        margin-bottom: 18px
      }

      .steps {
        margin-bottom: 16px
      }

      .card {
        padding: 2px 14px;
        border-radius: 22px
      }

      .row {
        padding: 14px 0;
        gap: 10px
      }

      .value {
        font-size: 1rem
      }

      #v-clabe {
        font-size: 1.05rem;
        letter-spacing: .3px;
        word-break: normal
      }

      .copy {
        padding: 12px 14px;
        min-width: 84px
      }

      .all {
        width: 100%;
        padding: 14px
      }

      .wa {
        padding: 18px 14px;
        font-size: 1rem;
        border-radius: 18px
      }

      body::before,
      body::after {
        width: 260px;
        height: 260px
      }
    }

    @media (max-width:340px) {
      h1 {
        font-size: 1.8rem
      }

      .row {
        flex-wrap: wrap
      }

      .copy {
        width: 100%
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="logo-wrap"><img class="logo" src="logo.png.jpg" alt="Logo Kekalabaza"></div>
    <h1>COMPROBANTE KE-KALABAZA</h1>
    <p class="sub">Copia los datos, realiza tu pago y envíanos el comprobante.</p>

    <div class="steps"><span><b>1</b> Copia</span><span><b>2</b> Paga</span><span><b>3</b> Envía</span></div>

    <section class="card" id="datos">
      <div class="row">
        <div class="info">
          <div class="label">Nombre</div>
          <div class="value" id="v-nombre">Daniela Yamile Levy Flores</div>
        </div>
        <button class="copy" data-target="v-nombre">Copiar</button>
      </div>
      <div class="row">
        <div class="info">
          <div class="label">Banco</div>
          <div class="value" id="v-banco">BBVA</div>
        </div>
        <button class="copy" data-target="v-banco">Copiar</button>
      </div>
      <div class="row">
        <div class="info">
          <div class="label">CLABE</div>
          <div class="value" id="v-clabe" data-copy="012180015265065725">012 180 01526506572 5</div>
        </div>
        <button class="copy" data-target="v-clabe">Copiar</button>
      </div>
    </section>

    <button class="all" id="copy-all">Copiar todos los datos</button>

    <a class="wa" id="enviar" target="_blank" rel="noopener"
      href="https://wa.me/527772382044?text=Hola%2C%20te%20env%C3%ADo%20mi%20comprobante%20de%20pago%20KETOMATE">
      <svg viewBox="0 0 32 32">
        <path
          d="M16 3C9 3 3.3 8.6 3.3 15.5c0 2.4.7 4.7 1.9 6.600L3 29l7.100-2.100c1.800 1 3.800 1.500 5.900 1.500 7 0 12.700-5.600 12.700-12.500S23 3 16 3zm6.500 17.600c-.3.800-1.600 1.500-2.200 1.600-.6.100-1.300.1-2.100-.1-.5-.2-1.200-.4-2-.8-3.500-1.500-5.700-5-5.900-5.300-.2-.2-1.400-1.800-1.400-3.400s.9-2.400 1.200-2.700c.3-.3.600-.4.800-.4h.6c.2 0 .5-.1.700.5.300.600.900 2.200 1 2.400.1.200.1.400 0 .6-.1.200-.2.400-.4.600l-.5.600c-.2.200-.4.400-.2.800.2.400 1 1.600 2.100 2.600 1.500 1.300 2.700 1.700 3.100 1.900.4.200.6.200.8-.1.200-.3 1-1.100 1.300-1.500.3-.4.500-.3.800-.2.300.1 2 .9 2.300 1.100.4.200.6.300.7.400.1.200.1.800-.2 1.600z" />
      </svg>
      <div>Enviar comprobante<small>WhatsApp · +52 777 238 2044</small></div>
    </a>
    <footer>KE-KALABAZA · Gracias por tu pago</footer>
  </main>
  <script>
    const copy = async (text, btn, label) => {
      try { await navigator.clipboard.writeText(text) } catch {
        const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove()
      }
      const old = btn.textContent; btn.textContent = '¡Copiado!'; btn.classList.add('ok');
      setTimeout(() => { btn.textContent = label || old; btn.classList.remove('ok') }, 1500);
    };
    const val = id => { const e = document.getElementById(id); return e.dataset.copy || e.textContent.trim() };
    document.querySelectorAll('.copy').forEach(b => b.onclick = () => copy(val(b.dataset.target), b));
    document.getElementById('copy-all').onclick = e => copy(
      `Nombre: ${val('v-nombre')}\nBanco: ${val('v-banco')}\nCLABE: ${val('v-clabe')}`, e.target, 'Copiar todos los datos');
  </script>
</body>

</html>
